<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Recuperar Contraseña</h2>
        <p class="description">Ingresa tu documento y correo consigandos en el registro, luego crea y confirma una nueva contraseñapara restablecerla.</p>
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="documentNumber">Número de Documento (DNI):</label>
                <input type="text" id="documentNumber" required placeholder="12345678">
            </div>
            
            <div class="form-group">
                <label for="resetCorreo">Correo electrónico:</label>
                <input type="email" id="resetCorreo" required placeholder="correo@ejemplo.com">
            </div>
            
            <div class="form-group">
                <label for="newPassword">Nueva Contraseña:</label>
                <input type="password" id="newPassword" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="newConfirmPassword">Confirmar Contraseña:</label>
                <input type="password" id="newConfirmPassword" required placeholder="••••••••">
            </div>
            
            <button type="submit">Recuperar Contraseña</button>
        </form>
        <p id="resetMsg" class="error"></p>

        <div class="auth-links">
            <p><a href="/login">Volver al inicio de sesión</a></p>
        </div>
    </div>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
