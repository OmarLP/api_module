<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Establecer Contraseña Inicial</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Primer Inicio de Sesión</h2>
        <p class="description">Ingresa tu correo registrado y establece tu contraseña por primera vez.</p>
        
        <form id="firstLoginForm">
            <div class="form-group">
                <label for="firstEmail">Correo electrónico:</label>
                <input type="email" id="firstEmail" required placeholder="correo@ejemplo.com">
            </div>
            <div class="form-group">
                <label for="firstPassword">Nueva Contraseña:</label>
                <input type="password" id="firstPassword" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label for="firstConfirmPassword">Confirmar Contraseña:</label>
                <input type="password" id="firstConfirmPassword" required placeholder="••••••••">
            </div>
            <button type="submit" id="btnSetPassword">Guardar Contraseña</button>
        </form>
        
        <p id="firstLoginMsg" class="error"></p>

        <div class="auth-links">
            <p><a href="/login">Volver al Inicio de Sesión</a></p>
        </div>
    </div>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
